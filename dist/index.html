          <article>
            <span>01 / 连续运动</span>
            <h3>1917 年的转针问题</h3>
            <p>
              在平面区域里，让长度为 1 的线段连续转过 180°，所需面积能有多小？
              若限于凸集，Pál 找到的最优区域是高为 1 的等边三角形；取消凸性后，面积可任意小。
            </p>
            <div class="mini-figure rotating-needle" aria-hidden="true"></div>
          </article>
          <article>
            <span>02 / 每个方向</span>
            <h3>Besicovitch 集合</h3>
            <p>
              集合 <i>K</i> 在每个方向都包含一条长度为 1 的线段。这样的集合可以拥有
              Lebesgue 零测度，平面里可以直观理解成“面积为零”。
            </p>
            <div class="mini-figure line-field" aria-hidden="true"></div>
          </article>
          <article>
            <span>03 / 尺度极限</span>
            <h3>现代挂谷集合猜想</h3>
            <p>
              任意 <i>n</i> 维挂谷集合都应拥有完整的 Hausdorff 维数 <i>n</i>；
              常讨论的 Minkowski 版本也预言完整维数。王虹与 Zahl 证明了 <i>n = 3</i>。
            </p>
            <div class="mini-figure dimension-cube" aria-hidden="true"></div>
          </article>
        </div>
      </section>

        </div>

        <div class="definition-grid">

            <p>

            </p>

                <mrow>

                  <mi>K</mi>
                  <mo>=</mo>
                  <mi>n</mi>
                </mrow>
              </math>
              <p>常用的 Minkowski 版本同样预言 <i>dim<sub>M</sub> K = n</i>。</p>
            </div>
            <p class="fact-line">
              <strong>三维结论：</strong>
              王虹与 Joshua Zahl 的 2025 年论文证明，每个
              <i>K ⊂ ℝ<sup>3</sup></i> 的挂谷集合都有 Hausdorff 与 Minkowski 维数 3。
            </p>
          </article>

          <article class="dimension-definitions">
            <div>
              <span>MEASURE</span>
              <h3>零体积仍可满维</h3>
              <p>
                Lebesgue 测度记录面积或体积。挂谷集合可以是零测度，
                同时拥有与环境空间相同的分形维数；“完整维数”不保证内部含有小球。
              </p>
            </div>
            <div>
              <span>MINKOWSKI</span>
              <h3>观察 δ 邻域的缩放</h3>
              <p>
                把 <i>K</i> 向外加粗 δ，得到 <i>K<sub>δ</sub></i>。若其体积大致按
                δ<sup>n−d</sup> 缩放，<i>d</i> 就是对应的盒维数直觉。
              </p>
            </div>
            <div>
              <span>HAUSDORFF</span>
              <h3>允许不同大小的覆盖</h3>
              <p>
                用直径可变的小集合覆盖 <i>K</i>，观察直径的 <i>s</i> 次幂总和。
                临界指数给出 Hausdorff 维数，通常比固定网格更精细。
              </p>
            </div>
          </article>

          <article class="delta-lab">
            <div class="delta-lab-head">
              <div>
                <span>δ-NEIGHBORHOOD</span>
                <h3>把零宽线段加粗</h3>
              </div>
              <output id="delta-output">δ = 0.030</output>
            </div>
            <canvas id="minkowski-canvas" aria-label="线段 δ 邻域演示"></canvas>
            <label for="delta-slider">管越细，允许的重叠越极端</label>
            <input
              id="delta-slider"
              type="range"
              min="0.008"
              max="0.080"
              step="0.002"
              value="0.030"
            />
            <div class="tube-formula">
              <span>离散细管版本（任意 ε &gt; 0）</span>
              <math display="block">
                <mrow>
                  <mo>|</mo>
                  <mi>U</mi><mo>(</mo><mi>𝕋</mi><mo>)</mo>
                  <mo>|</mo>
                  <mo>≥</mo>
                  <mi>c</mi><mo>(</mo><mi>n</mi><mo>,</mo><mi>ε</mi><mo>)</mo>
                  <msup><mi>δ</mi><mi>ε</mi></msup>
                </mrow>
              </math>
              <p>
                取约 δ<sup>−(n−1)</sup> 根长 1、半径 δ、方向彼此相隔至少约 δ 的细管。
                猜想要求它们的并集不会比 δ<sup>ε</sup> 量级更小。
              </p>
            </div>
          </article>
        </div>

          <h2 id="se-intuition-title">直觉模型：一次苛刻的三点对齐</h2>
          <p>新月每月都有，日食却不是。差别藏在两个角度和一段距离里。</p>
        </div>
      </div>
      <div class="se-intuition-copy">
        <p>
          太阳直径约为月球的 400 倍，距离也恰好约为月地距离的 400 倍——两者在天空中的视直径
          几乎相同，都接近 0.5°。这一巧合让月球有机会不多不少地遮住日面，露出日冕。
        </p>
        <p>
          但月球绕地轨道相对黄道面倾斜约 <strong>5.1°</strong>。多数新月时刻，月球从太阳
          上方或下方数千公里处掠过，影子落进太空。只有当新月恰好发生在轨道与黄道的交点
          附近，本影或半影才能碰到地球，这就是日食季每年只出现约两次的原因。
        </p>
        <p>
          即使对齐成功，食型还取决于距离：月球本影平均长约 37.4 万公里，而月地平均距离约
          38.4 万公里。月球离地球较近时本影尖端够得着地面，看到日全食；较远时本影在半空
          收尖，地面进入其延长线（伪本影），看到的是日环食。
        </p>
      </div>
    </section>

    <section class="section-pad" aria-labelledby="se-limits-title">
      <div class="section-heading">
        <p class="section-index">02</p>
        <div>
          <h2 id="se-limits-title">这个模型简化了什么</h2>
          <p>先说清楚画面与真实世界的差距，再谈直觉。</p>
        </div>
      </div>
      <div class="limits-grid">
        <article>
          <span>比例夸张</span>
          <h3>尺寸与距离不成比例</h3>
          <p>
            按真实比例，地球在此画面中只有针尖大，太阳远在数百米外。画面放大了地球、月球
            与影锥，但食型与日食带的判定全部由公里级真实数值计算。
          </p>
        </article>
        <article>
          <span>轨道简化</span>
          <h3>圆轨道 + 固定交点</h3>
          <p>
            真实月球轨道是偏心率约 0.055 的椭圆，交点还以约 18.6 年的周期退行。这里用圆轨
            道加距离滑杆代替椭圆，用滑杆固定交点方位，不演化沙罗周期。
          </p>
        </article>
        <article>
          <span>地表简化</span>
          <h3>不含地球自转与大气折射</h3>
          <p>
            真实日食带的形状由地球自转、扁率与月影移动速度共同决定，本影地表速度常超过
            2000 km/h。此处的红线只是影轴扫过静止球面的几何轨迹。
          </p>
        </article>
      </div>
    </section>

        <p class="hero-lead">

    <section class="section-pad" id="le-intuition" aria-labelledby="le-intuition-title">
      <div class="section-heading">
        <p class="section-index">01</p>
        <div>
          <h2 id="le-intuition-title">直觉模型：一次穿过影子的旅行</h2>
          <p>地球背向太阳的一侧拖着两层影子，月球偶尔会游进去。</p>
        </div>
      </div>
      <div class="le-intuition-copy">
        <p>
          地球的本影是一个长约 <strong>140 万公里</strong>的锥体，在月球轨道距离处直径仍约
          9200 公里，超过月球直径的 2.6 倍。围绕本影还有一圈更淡的半影。满月时若月球恰好
          位于黄白交点附近，就会先后穿过半影与本影，形成半影月食、月偏食或月全食。
        </p>
        <p>
          与日食相同，月球轨道 5.1° 的倾角让多数满月从影锥上方或下方掠过——月食也不是每月
          都有。但月食一旦发生，面向月球的整个半球都能看到，这就是多数人一生中看过的月食
          远多于日食的原因。
        </p>
        <p>
          月全食的红色来自<strong>瑞利散射</strong>：太阳光掠过地球大气边缘时，波长较短的蓝
          光被空气分子强烈散射掉（散射强度约与波长四次方成反比），剩下的红光经大气折射弯
          进本影内部，把月面照成暗红色——本质上，那是环绕地球一整圈的日出与日落投在月亮上。
        </p>
      </div>
    </section>

    <section class="section-pad" aria-labelledby="le-limits-title">
      <div class="section-heading">
        <p class="section-index">02</p>
        <div>
          <h2 id="le-limits-title">这个模型简化了什么</h2>
          <p>影锥与月球的相对大小是真实的，其余多有取舍。</p>
        </div>
      </div>
      <div class="limits-grid">
        <article>
          <span>比例夸张</span>
          <h3>月地距离被大幅压缩</h3>
          <p>
            真实月地距离约为地球半径的 60 倍，画面压缩到 4 倍。地月半径比、影锥在月球轨道处
            的粗细比例保持真实，食分全部按公里数值计算。
          </p>
        </article>
        <article>
          <span>轨道简化</span>
          <h3>黄纬用滑杆直接给定</h3>
          <p>
            真实月球黄纬由交点位置与轨道运动共同决定，且交点以 18.6 年周期退行。这里用一个
            滑杆直接设定满月时刻的黄纬，方便逐档观察食分变化。
          </p>
        </article>
        <article>
          <span>光学简化</span>
          <h3>红色是着色，不是光谱计算</h3>
          <p>
            真实月全食的亮度与色调受大气尘埃、火山灰与臭氧影响（丹容标度 L0–L4），本影边缘
            也并非锐利。画面仅按入影深度对月面做颜色插值。
          </p>
        </article>
      </div>
    </section>

  <div class="ss-scene" id="main">
    <section class="hero" id="top">
      <div class="hero-copy">
        <p class="figure-no">FIG. 04 / SOLAR SYSTEM LAB</p>
        <h1>八颗行星，<br />同一套<br />钟表齿轮。</h1>
        <p class="hero-lead">
          水星 88 天转一圈，海王星要 165 年。把时间拨快，行星的节奏差立刻显形。
        </p>
        <a class="primary-action" href="#ss-intuition">
          开始实验
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M14 7l5 5-5 5" />
          </svg>
        </a>
        <p class="hero-note">
          拖动旋转 · 滚轮缩放 · 滑杆调节时间倍速<br />
          公转周期比例真实，行星大小经过夸张。
        </p>
      </div>

      <div class="lab-shell" aria-label="太阳系三维交互实验">
        <div class="lab-canvas-wrap">
          <canvas id="ss-canvas" aria-label="八大行星轨道与公转三维模型"></canvas>
          <div class="canvas-caption">
            <span id="ss-caption">压缩尺度 · 行星大小非真实比例</span>

          </div>

          <h2>实验设置</h2>

          <div class="ss-status" aria-live="polite">

            <output id="ss-speed-output">10 天/秒</output>
          </label>
          <input id="ss-speed" type="range" min="0" max="100" step="1" value="50" />

          <div class="lab-actions">
            <button id="ss-scale-toggle" class="accent-button" type="button" aria-pressed="false">

            </button>
            <button id="ss-retro-toggle" type="button" aria-pressed="false">

            </button>

    </section>

    <section class="section-pad" id="ss-intuition" aria-labelledby="ss-intuition-title">
      <div class="section-heading">
        <p class="section-index">01</p>
        <div>
          <h2 id="ss-intuition-title">直觉模型：越远越慢的行星</h2>
          <p>公转周期不是随意的，它被开普勒第三定律锁死在轨道半径上。</p>
        </div>
      </div>
      <div class="ss-intuition-copy">
        <p>
          行星离太阳越远，走得越慢，路也越长。开普勒第三定律给出精确关系：<strong>周期的平方
          正比于轨道半长轴的立方</strong>。海王星距离太阳约 30 天文单位，周期便是
          30<sup>1.5</sup> ≈ 165 个地球年——自 1846 年被发现以来，它刚完成第一整圈。
        </p>
        <p>
          真实比例下的太阳系几乎全是空隙：若把地球轨道画成 1 米，海王星在 30 米外，而行星本身
          小到看不见。因此本实验提供两种画法——压缩尺度便于总览节奏，真实间距还原空旷本相。
        </p>
        <p>
          "火星逆行"曾困扰古代天文学家上千年：火星通常相对恒星背景向东走，每约 26 个月却倒退
          数周。哥白尼给出的解释很朴素——地球在内圈跑得快（约 30 km/s 对火星 24 km/s），每次
          "超车"时，从地球看去火星就在天幕上打了一个回环。打开逆行演示，观察视线轨迹。
        </p>
      </div>
    </section>

    <section class="section-pad" aria-labelledby="ss-limits-title">
      <div class="section-heading">
        <p class="section-index">02</p>
        <div>
          <h2 id="ss-limits-title">这个模型简化了什么</h2>
          <p>周期比例可信，形状与大小另当别论。</p>
        </div>
      </div>
      <div class="limits-grid">
        <article>
          <span>轨道简化</span>
          <h3>圆轨道 + 共面假设</h3>
          <p>
            真实行星轨道是椭圆（水星偏心率 0.206），且各有数度的轨道倾角。这里一律画成同一
            平面上的圆，公转角速度取平均值，不含近日点加速。
          </p>
        </article>
        <article>
          <span>比例夸张</span>
          <h3>行星大小放大了上千倍</h3>
          <p>
            按真实比例，地球直径不足其轨道直径的两万分之一。画面中的行星半径只保留彼此的
            大小次序（木星最大、水星最小），绝对比例完全失真。
          </p>
        </article>
        <article>
          <span>取舍</span>
          <h3>不含卫星、矮行星与自转</h3>
          <p>
            月球、木星伽利略卫星、小行星带与冥王星等矮行星均未画出；行星自转与轴倾角也被
            省略。逆行演示中的"天幕"只是一个固定半径的假想球面。
          </p>
        </article>
      </div>
    </section>

          <p class="hero-lead">
            日地距离一年只变化约 3.3%，真正改变阳光的，是 23.44° 的地轴倾角：

            <h2 id="seasons-intuition-title">直觉模型</h2>
            <p>公转一圈，地轴方向几乎不变；变的是太阳直射点落在哪条纬线上。</p>
          </div>
        </div>
        <div class="seasons-copy">
          <article>
            <span>01 / 指向不变</span>
            <h3>地轴始终指向同一方向</h3>
            <p>
              地球绕太阳公转时，自转轴始终指向天空中几乎同一个位置（北极星附近），
              与公转轨道面法线夹角约 23.44°。于是一年之中，太阳直射点在南北回归线
              （±23.44°）之间往返移动。
            </p>
          </article>
          <article>
            <span>02 / 角度决定能量</span>
            <h3>直射得多，斜射摊薄</h3>
            <p>
              直射时，单位面积地表接收的阳光最多，白昼也更长；斜射时，同一束阳光
              摊在更大的面积上，且白昼变短。北半球的夏至前后，正是“直射靠北 + 长昼”
              两个效应叠加的时候。
            </p>
          </article>
          <article>
            <span>03 / 距离不是原因</span>
            <h3>近日点反而在 1 月</h3>
            <p>
              地球轨道接近圆形：近日点在 1 月初（约 1.471 亿千米），远日点在 7 月初
              （约 1.521 亿千米），相差仅约 3.3%。若距离主导季节，南北半球就不会
              季节相反——事实恰恰相反。
            </p>
          </article>
        </div>

            <p>

              因此北半球冬半年比夏半年短几天。演示中画成匀速正圆。
            </p>
          </article>

            <p>
              按真实比例，太阳直径约为地球的 109 倍，轨道半径约为太阳直径的 107 倍，
              无法同屏显示。这里只保留几何关系，不保留比例。
            </p>
          </article>

              海洋与大气的热惯性使最热、最冷的月份晚于夏至、冬至约一到两个月。
              本页只演示光照几何，不演示气候响应。
            </p>

    <div class="moonp-scene" id="main">
      <section class="hero" id="top">
        <div class="hero-copy">
          <p class="figure-no">FIG. 03 / MOON PHASES LAB</p>
          <h1>月亮没有变，<br />变的是<br />我们的视角</h1>
          <p class="hero-lead">
            太阳永远照亮月球的一半。月球绕地球公转时，我们看到那被照亮的半球
            以不同的侧面朝向我们——这就是月相。
          </p>
          <a class="primary-action" href="#moonp-intuition">
            开始实验
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14M14 7l5 5-5 5" />
            </svg>
          </a>
          <p class="hero-note">
            拖动旋转 · 滚轮缩放 · 滑杆改变轨道相位角<br />
            右侧小窗同步显示从地球看到的月相。
          </p>
        </div>

        <div class="lab-shell" aria-label="月相交互实验">
          <div class="lab-canvas-wrap">
            <canvas class="moonp-canvas" id="moonp-canvas" aria-label="月球绕地球公转三维模型"></canvas>
            <div class="canvas-caption">
              <span>俯视北天极 · 阳光自右侧平行入射</span>
              <span id="moonp-status">新月 · 照亮 0%</span>
            </div>
          </div>

          <aside class="lab-controls" aria-label="实验设置">
            <h2>实验设置</h2>

            <div class="moonp-inset">
              <canvas id="moonp-inset-canvas" aria-label="从地球看到的月相"></canvas>
            </div>
            <p class="moonp-inset-caption">从地球看到的月相 · 北半球视角</p>

            <label class="control-row" for="moonp-phase">
              <span>轨道相位角 α（自新月起）</span>
              <output id="moonp-phase-output">0°</output>
            </label>
            <input id="moonp-phase" type="range" min="0" max="360" step="1" value="0" />

            <div class="moonp-jumps" role="group" aria-label="跳到月相">
              <button type="button" data-phase="0" class="is-active">新月</button>
              <button type="button" data-phase="90">上弦月</button>
              <button type="button" data-phase="180">满月</button>
              <button type="button" data-phase="270">下弦月</button>
            </div>

            <div class="moonp-data" aria-live="polite">
              <div>
                <span>月相</span>
                <strong id="moonp-name">新月</strong>
              </div>
              <div>
                <span>照亮比例</span>
                <strong id="moonp-illum">0%</strong>
              </div>
              <div>
                <span>月龄（朔望月 29.53 天）</span>
                <strong id="moonp-age">第 0.0 天</strong>
              </div>
            </div>

            <div class="lab-actions">
              <button id="moonp-reset" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">

                </svg>

              </button>

                播放公转

      <section class="moonp-intuition section-pad" id="moonp-intuition" aria-labelledby="moonp-intuition-title">
        <div class="section-heading">
          <p class="section-index">01</p>
          <div>
            <h2 id="moonp-intuition-title">直觉模型</h2>
            <p>月相不是地球影子，而是“日–地–月”三者夹角的几何结果。</p>
          </div>
        </div>
        <div class="moonp-copy">
          <article>
            <span>01 / 永远半亮</span>
            <h3>太阳光近似平行入射</h3>
            <p>
              太阳距离约为地月距离的 390 倍，射到地月系统的阳光可以视为平行光束。
              无论月球在轨道何处，它总有一半被照亮、一半处于黑夜——变化的只是
              我们能看到亮面的多少。
            </p>
          </article>
          <article>
            <span>02 / 夹角决定形状</span>
            <h3>相位角从新月数起</h3>
            <p>
              新月时月球位于太阳与地球之间，亮面背对我们；满月时地球居中，
              亮面正对我们。从新月起算的相位角每转过约 45°，就依次出现
              娥眉月、上弦月、盈凸月、满月，再对称地亏回去。
            </p>
          </article>
          <article>
            <span>03 / 常见误解</span>
            <h3>月相不是地影</h3>
            <p>
              地球影子落在月面上的现象叫月食，只发生在满月且三者近乎精确成一线时。
              日常的月相圆缺与地影无关——不然弦月的明暗界线不会是那条柔和的椭圆弧。
            </p>
          </article>
        </div>
      </section>

      <section class="section-pad" aria-labelledby="moonp-months-title">
        <div class="section-heading">
          <p class="section-index">02</p>
          <div>
            <h2 id="moonp-months-title">两种“一个月”</h2>
            <p>月球转回同一位置，和月相转回同一形状，不是同一件事。</p>
          </div>
        </div>
        <div class="moonp-months">
          <article>
            <span>恒星月 · Sidereal</span>
            <strong>27.32 天</strong>
            <p>
              以遥远恒星为参照，月球绕地球公转一整圈所需的时间。
              这是轨道运动本身的周期。
            </p>
          </article>
          <article>
            <span>朔望月 · Synodic</span>
            <strong>29.53 天</strong>
            <p>
              从新月到下一次新月的时间。月相取决于“日–地–月”夹角，
              这也是农历一个月的依据。
            </p>
          </article>
        </div>
        <p class="moonp-months-note">
          差别的来源：在月球公转的这一个月里，地球自己也沿公转轨道前进了约 27°。
          月球转满一圈（恒星月）后，还要再追赶约 27° 才能回到与太阳同侧的位置，
          多花约 2.2 天——所以朔望月比恒星月长。
        </p>
      </section>

      <section class="section-pad" aria-labelledby="moonp-limits-title" style="padding-top: 0;">
        <div class="section-heading">
          <p class="section-index">03</p>
          <div>
            <h2 id="moonp-limits-title">这个模型简化了什么</h2>
            <p>把简化说清楚，直觉才不会变成误解。</p>
          </div>
        </div>
        <div class="moonp-limits-grid">
          <article>
            <span>轨道</span>
            <h3>圆轨道与共面假设</h3>
            <p>
              真实月球轨道偏心率约 0.055，且相对黄道面倾斜约 5.1°——正因为这个倾角，
              并非每个朔望都发生日食或月食。演示中轨道画成同一平面内的正圆。
            </p>
          </article>
          <article>
            <span>比例</span>
            <h3>大小与距离不成比例</h3>
            <p>
              地月平均距离约 38.44 万千米，约为地球直径的 30 倍；按真实比例，
              画面上几乎看不到月球。这里只保留角度关系。
            </p>
          </article>
          <article>
            <span>光照</span>
            <h3>忽略地照与天平动</h3>
            <p>
              娥眉月的暗面常隐约可见，那是地球反照的“地照”；月球的天平动
              让我们实际能看到约 59% 的月面。两者均未在模型中体现。
            </p>
          </article>
          <article>
            <span>视角</span>
            <h3>小窗采用北半球视角</h3>
            <p>
              月相小窗按北半球中纬度习惯绘制：盈月亮在右、亏月亮在左。
              在南半球观察，左右正好相反。
            </p>
          </article>
        </div>
      </section>

    <div class="tides-scene" id="main">
      <section class="hero" id="top">
        <div class="hero-copy">
          <p class="figure-no">FIG. 04 / TIDES LAB</p>
          <h1>月亮拉海水，<br />拉出<br />两个隆起</h1>
          <p class="hero-lead">
            潮汐不是月亮“吸走”海水那么简单：近月侧与远月侧同时鼓起，
            地球在双隆起下自转，多数海岸一天迎来约两次涨落。
          </p>
          <a class="primary-action" href="#tides-intuition">
            开始实验
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14M14 7l5 5-5 5" />
            </svg>
          </a>
          <p class="hero-note">
            拖动旋转 · 滚轮缩放 · 滑杆调节地月距离与公转位置<br />
            隆起幅度已大幅夸张，引潮力按 1/r³ 真实关系计算。
          </p>
        </div>

        <div class="lab-shell" aria-label="潮汐交互实验">
          <div class="lab-canvas-wrap">
            <canvas class="tides-canvas" id="tides-canvas" aria-label="地月系统潮汐隆起三维模型"></canvas>
            <div class="canvas-caption">
              <span>海水层隆起已大幅夸张 · 红点为地表观察点</span>
              <span id="tides-status">引潮力 1.00× · 太阳影响关</span>
            </div>
          </div>

          <aside class="lab-controls" aria-label="实验设置">
            <h2>实验设置</h2>

            <label class="control-row" for="tides-dist">
              <span>地月距离（相对平均值）</span>
              <output id="tides-dist-output">1.00×</output>
            </label>
            <input id="tides-dist" type="range" min="0.7" max="1.3" step="0.01" value="1" />

            <label class="control-row" for="tides-angle">
              <span>月球公转位置（0° 为朔）</span>
              <output id="tides-angle-output">0°</output>
            </label>
            <input id="tides-angle" type="range" min="0" max="360" step="1" value="0" />

            <button id="tides-sun" class="tides-toggle" type="button" aria-pressed="false">
              太阳影响（演示大潮 / 小潮）
              <span class="tides-toggle-state">关</span>
            </button>

            <div class="tides-data" aria-live="polite">
              <div>
                <span>月球引潮力（相对 1/r³）</span>
                <strong id="tides-force">1.00×</strong>
              </div>
              <div>
                <span>太阳 / 月球引潮力之比</span>
                <strong id="tides-ratio">0.46（固定）</strong>
              </div>
              <div>
                <span>当前潮型</span>
                <strong id="tides-type">—（未计太阳）</strong>
              </div>
            </div>

            <p class="tides-footnote">
              真实的开阔大洋中，平衡潮隆起只有几十厘米量级；
              画面把它放大了数百万倍才肉眼可见。
            </p>

            <div class="lab-actions">
              <button id="tides-reset" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 12a8 8 0 1 0 2.34-5.66M4 4v6h6" />
                </svg>
                重置视角
              </button>
              <button id="tides-play" class="accent-button" type="button" aria-pressed="false">
                播放公转
              </button>
            </div>
          </aside>
        </div>

      <section class="tides-intuition section-pad" id="tides-intuition" aria-labelledby="tides-intuition-title">
        <div class="section-heading">
          <p class="section-index">01</p>
          <div>
            <h2 id="tides-intuition-title">直觉模型</h2>
            <p>关键不是引力本身，而是引力在地球两侧的“差值”。</p>
          </div>
        </div>
        <div class="tides-copy">
          <article>
            <span>01 / 差异引力</span>
            <h3>近侧拉得多，远侧拉得少</h3>
            <p>
              月球引力随距离衰减：地球近月一侧被拉得比地心更用力，远月一侧
              被拉得更弱。以地心为参照，两侧海水都相对“向外”偏离——
              这就是引潮力，也是双隆起的来源。
            </p>
          </article>
          <article>
            <span>02 / 立方反比</span>
            <h3>引潮力 ∝ M / r³</h3>
            <p>
              引力按 1/r² 衰减，而引潮力是引力的差值，按 1/r³ 衰减。
              太阳引力远强于月球，但因距离是地月距离的约 390 倍，
              其引潮力反而只有月球的约 46%——月球主导潮汐。
            </p>
          </article>
          <article>
            <span>03 / 大潮小潮</span>
            <h3>叠加还是抵消</h3>
            <p>
              朔（新月）与望（满月）时，日月引潮力方向成一线，隆起叠加，
              形成大潮；上弦、下弦时两者相互垂直，部分抵消，形成小潮。
              两者潮差通常相差可达一倍左右，随海区而异。
            </p>
          </article>
        </div>
      </section>

      <section class="section-pad" aria-labelledby="tides-limits-title">
        <div class="section-heading">
          <p class="section-index">02</p>
          <div>
            <h2 id="tides-limits-title">这个模型简化了什么</h2>
            <p>这里演示的是“平衡潮”理想模型——真实海潮要复杂得多。</p>
          </div>
        </div>
        <div class="tides-limits-grid">
          <article>
            <span>平衡潮假设</span>
            <h3>海水被当作瞬时响应的薄壳</h3>
            <p>
              模型假设全球被均匀海水覆盖、且瞬间调整到受力平衡的形状。
              真实海水有惯性与摩擦，潮波在海盆中传播、反射、共振，
              实际高潮时刻往往滞后于月球过顶。
            </p>
          </article>
          <article>
            <span>地形</span>
            <h3>没有大陆与海底地形</h3>
            <p>
              大陆阻挡与浅海放大效应使各地潮差悬殊：开阔大洋不足 1 米，
              芬迪湾可超过 15 米。这些都无法从平衡潮模型读出。
            </p>
          </article>
          <article>
            <span>幅度与比例</span>
            <h3>隆起被放大了数百万倍</h3>
            <p>
              画面中的隆起幅度、天体大小与距离均未按真实比例绘制。
              距离滑杆对应的 0.7–1.3 倍变化范围也远大于真实月球轨道
              近地点 / 远地点约 ±5.5% 的变化。
            </p>
          </article>
          <article>
            <span>其他因素</span>
            <h3>忽略轨道倾角与固体潮</h3>
            <p>
              月球轨道相对赤道有倾角，带来周日潮不等；地壳本身也有几十厘米的
              固体潮形变；太阳距离同样有年变化。模型将这些全部略去。
            </p>
          </article>
        </div>
      </section>

        <div>
          <h2 id="sat-intuition-title">直觉模型：牛顿的大炮</h2>
          <p>把大炮架上高山，炮弹打得越快，落点越远——快到某个程度，它就再也落不回来。</p>
        </div>
      </div>
      <div class="sat-copy">
        <p>
          卫星并没有逃离重力。在 400 km 高度，地球引力仍有地面的约 89%。卫星之所以不掉下来，
          是因为它横向速度足够大：每下落一段，地面也因为地球的曲率“躲开”了一段。轨道就是一场永远追不上的坠落。
        </p>
        <p>
          在同一高度切向发射，结局只取决于速度。速度恰好等于 √(μ/r) 时得到圆轨道；再快一些，轨道拉成椭圆，
          发射点成为近地点；达到 √(2μ/r)（约为圆轨道速度的 1.41 倍）时能量归零，卫星沿抛物线一去不返；
          而速度不足时，椭圆的近地点会低到扎进大气层——那就是坠落。
        </p>
        <p>
          高度还决定周期。开普勒第三定律说 T² ∝ a³：轨道越高，转一圈越久。GEO 的 35786 km
          正是让周期精确等于一个恒星日（23 时 56 分）的高度，卫星因此“钉”在赤道上空同一点。
        </p>
      </div>
    </section>

        </div>

      <div class="limits-grid">
        <article>
          <span>简化 1</span>
          <h3>纯二体、无摄动</h3>
          <p>

            GEO 卫星需要定期修正位置。
          </p>
        </article>
        <article>
          <span>简化 2</span>
          <h3>大气阻力被放大</h3>
          <p>
            为了几十秒内看清衰减螺旋，阻力系数被人为放大了多个数量级。
            真实的 400 km 轨道衰减以月和年计，且强烈依赖太阳活动。
          </p>
        </article>

          </p>
        </article>

        <p class="figure-no">FIG. 03 / TECTONICS LAB</p>
        <h1>大陆在漂，<br />只是慢得<br />像指甲生长。</h1>
        <p class="hero-lead">
          地球外壳碎成十几块刚性板块，以每年 2–10 cm 的速度相互推挤、分离、错动。
        </p>
        <a class="primary-action" href="#plate-intuition">

          <svg viewBox="0 0 24 24" aria-hidden="true">

        </a>

          板块形状为示意简化，运动方向参考现代 GPS 观测趋势。

    <section class="section-pad" id="plate-intuition" aria-labelledby="plate-intuition-title">
      <div class="section-heading">
        <p class="section-index">01</p>
        <div>
          <h2 id="plate-intuition-title">直觉模型：漂在软垫上的硬壳</h2>
          <p>岩石圈是硬的，下面的软流圈却能缓慢流动——硬壳因此可以整块移动。</p>
        </div>
      </div>
      <div class="plate-copy">
        <p>
          地球最外层约 100 km 厚的岩石圈并不是完整一块，而是碎成七大板块与若干小板块。
          板块内部近似刚性，变形和地震集中在板块之间的边界上——把全球地震震中画在地图上，
          板块的轮廓会自己浮现出来。
        </p>
        <p>
          刚性板块在球面上的运动等价于绕某根轴的旋转，这根轴与地表的交点叫欧拉极。
          板块上每一点的速度方向都垂直于它到欧拉极的连线，离极越远走得越快。
          本页的演示正是让每个板块绕各自的欧拉极匀速旋转。
        </p>
        <p>
          速度量级是每年 2–10 cm：大西洋中脊扩张较慢（约 2–5 cm/yr），东太平洋隆起较快（可超过 10 cm/yr）。
          听上去微不足道，但乘以一亿年，就是上万公里——足够让大西洋从一条裂缝张成一片大洋。
        </p>
      </div>
    </section>

    <section class="section-pad" aria-labelledby="plate-boundary-title">
      <div class="section-heading">
        <p class="section-index">02</p>
        <div>
          <h2 id="plate-boundary-title">剖面实验：三种板块边界</h2>
          <p>板块相遇的方式只有三种：分开、相撞、擦肩而过。</p>
        </div>
      </div>
      <div class="plate-section-lab">
        <div class="plate-section-panel">
          <canvas id="plate-section-canvas" aria-label="板块边界剖面示意"></canvas>
        </div>
        <div class="plate-section-copy">
          <div class="segmented" role="group" aria-label="边界类型">
            <button class="is-active" data-plate-boundary="divergent" type="button">离散边界</button>
            <button data-plate-boundary="convergent" type="button">汇聚边界</button>
            <button data-plate-boundary="transform" type="button">转换边界</button>
          </div>
          <h3 id="plate-boundary-name">离散边界 · 洋中脊</h3>
          <p id="plate-boundary-body">
            两个板块相互分离，地幔物质上涌、冷凝成新的洋壳，形成绵延全球约 6.5 万 km 的洋中脊体系。
            大西洋中脊每年新增约 2–5 cm 洋底，冰岛正是它露出海面的部分。
          </p>
        </div>
      </div>
    </section>

    <section class="limits section-pad" aria-labelledby="plate-limits-title">
      <div class="section-heading">
        <p class="section-index">03</p>
        <div>
          <h2 id="plate-limits-title">这个模型简化了什么</h2>
          <p>示意图帮助看清机制，但真实板块构造有更多细节。</p>
        </div>
      </div>
      <div class="limits-grid">
        <article>
          <span>简化 1</span>
          <h3>板块形状是示意的</h3>
          <p>
            画面用球面近邻分区生成色块，只保留“十几块、大小悬殊”的拓扑感，
            并不复现真实板块边界的几何细节。
          </p>
        </article>
        <article>
          <span>简化 2</span>
          <h3>欧拉极与速度被固定</h3>
          <p>
            演示假设每个板块的旋转轴和速率在两亿年里不变。真实板块运动会因碰撞、俯冲板片断离
            等事件改变方向——印度板块就曾在与欧亚碰撞后明显减速。
          </p>
        </article>
        <article>
          <span>简化 3</span>
          <h3>边界不产生新地壳</h3>
          <p>
            演示中板块分离处只露出底色，不生成新洋壳，汇聚处则直接穿插。
            真实边界伴随增生、俯冲消减、造山与火山作用。
          </p>
        </article>
      </div>
    </section>

        <div>
          <h2 id="refr-intuition-title">直觉模型：光在换挡</h2>
          <p>折射率 n 是"光在这种介质里慢了多少倍"。光变速，方向就得跟着变。</p>
        </div>
      </div>
      <div class="refr-copy">
        <p>
          光在真空中每秒走约 30 万 km，进入水里就慢到约 22.5 万 km（30÷1.33）。
          一个常用的类比：一队士兵斜着从公路踏进泥地，先踩进泥地的一侧先减速，
          整个队列的前进方向于是向"慢的一侧"偏转——这就是光从疏介质进入密介质时向法线偏折的原因。
        </p>
        <p>
          Snell 定律把这件事写成等式：n₁sinθ₁ = n₂sinθ₂。两侧折射率差得越多，弯折越明显。
          它在 1621 年由斯涅尔重新发现，也可以从费马"光走耗时最短路径"的原理推出。
        </p>
        <p>
          反过来，光从密介质射向疏介质（比如从水底望向水面）时会偏离法线。当入射角超过临界角
          θc = arcsin(n₂/n₁)，sinθ₂ 需要大于 1——折射光线不存在了，全部能量被反射回来，这就是全反射。
          水下 48.6° 之外的天空看不见、光纤把信号困在纤芯里、钻石 24.4° 的小临界角让光反复内弹，都是同一件事。
        </p>

          </p>
        </article>
        <article>
          <span>简化 2</span>

            画面只用线条粗细与透明度示意"临界角附近反射变强"的趋势，数值并不精确。

        <h2 id="fourier-define-title">定义：傅里叶级数</h2>
        <p>周期为 2π 的函数可展开为正弦/余弦的加权和。</p>
      </div>
    </div>
    <p>
      以方波为例，其傅里叶级数为 <code>f(θ) = (4/π)·Σ sin((2k−1)θ)/(2k−1)</code>，
      只含奇次谐波、振幅随 1/(2k−1) 衰减。锯齿波与三角波的系数结构不同（见上方波形切换）：
      锯齿波含全部整数次谐波、三角波衰减最快（1/(2k+1)²），所以三角波用很少的谐波就已很平滑。
      切换波形并调小 <i>N</i>，可以直观看到「收敛快慢」的差异。

      后者组成的点集，就是曼德博集合——黑色那团。它最反直觉的地方在于：
      <strong>边界上随便挑一小段放大，都会冒出和整体惊人相似的新结构</strong>，无穷无尽。
    </p>

        <p>集合的精确数学表述。</p>
      </div>

      等价于：若某个 <i>n</i> 使 |<i>z</i><sub>n</sub>| &gt; 2，则序列必发散，<i>c</i> ∉ <i>M</i>；
      若对所有 <i>n</i> 都有 |<i>z</i><sub>n</sub>| ≤ 2，则 <i>c</i> ∈ <i>M</i>。
      渲染时我们用"逃逸所需的最小迭代次数"给外部上色——迭代越久才逃，颜色越深，正好勾勒出边界的精细褶皱。
    </p>
  </section>

    </p>

        <p>同一次地震，P 波先到、S 波后到，中间隔着一段空白。</p>
      </div>
    </div>
    <p>
      想象两个人从同一起点出发跑向终点，一个快、一个慢。终点处的人看两人到达的<b>时间差</b>，

      P 与 S 是速度已知的两位"跑者"，它们的到时差 Δt 越大，震源越远。
    </p>
  </section>

  <section class="section-pad" id="seis-def" aria-labelledby="seis-def-title">

        <p>体波（body wave）的两种：纵波与横波。</p>
      </div>
    </div>
    <p>
      <b>P 波（纵波 / 初至波）</b>：介质粒子沿传播方向来回振动，像弹簧的疏密波，速度最快，能在固体与液体中传播。
      <b>S 波（横波 / 次波）</b>：粒子垂直于传播方向振动，速度约为 P 波的 0.55–0.6 倍，且<b>无法在液体中传播</b>——
      正是这一点，让科学家在 20 世纪证实地球外核是液态的。本实验中两者速度由滑块设定，互不相干地向外扩张。
    </p>
  </section>

      </div>

    </p>

    </p>

      <div>
        <h2 id="ely-intuition-title">直觉：水不是"元素"</h2>
        <p>看似纯净的一杯水，其实是氢和氧的化合物。</p>
      </div>
    </div>
    <p>
      通电之前，水安静地待在杯里。一旦接上直流电，水分子被"拆开"：在负极（阴极）得到电子放出
      <b>氢气</b>，在正极（阳极）放出 <b>氧气</b>。两种气体用倒扣的试管收集，会发现氢气体积总是氧气的
      <b>两倍</b>——这个 2:1，正是水分子里氢原子与氧原子的个数比。
    </p>
  </section>

  <section class="section-pad" id="ely-define" aria-labelledby="ely-define-title">
    <div class="section-heading">
      <p class="section-index">02</p>
      <div>
        <h2 id="ely-define-title">定义：电解水反应</h2>
        <p>水在直流电下分解为氢气与氧气。</p>
      </div>
    </div>
    <p style="font-family: var(--mono, monospace); font-size: 13px; line-height: 2">
      阴极(−)：2H₂O + 2e⁻ → H₂↑ + 2OH⁻<br />
      阳极(+)：2H₂O → O₂↑ + 4H⁺ + 4e⁻<br />
      总反应：2H₂O <span style="white-space:nowrap">—通电→</span> 2H₂↑ + O₂↑
    </p>
    <p>
      每生成 1 个 O₂ 分子，同时生成 2 个 H₂ 分子，所以同温同压下
      <b>V(H₂) : V(O₂) = 2 : 1</b>。据此还能推知：水由氢、氧两种元素组成，分子中 H:O = 2:1。
    </p>
  </section>

  <section class="section-pad" id="ely-lab" aria-labelledby="ely-lab-title">
    <div class="section-heading">
      <p class="section-index">03</p>

        <p>通电、调电流、看体积比如何稳定收敛到 2:1。</p>
      </div>
    </div>
    <p>
      点「通电」开始电解：左侧阴极冒气泡更快（氢气），右侧阳极较慢（氧气）。两根量气管的液面随之下降，
      气体体积持续增长。建议这样观察：
    </p>
    <p style="margin-top:8px">
      ① 调大「电流大小」，气泡更密、产气更快，但 2:1 的比例不变；<br />
      ② 等任一试管集满，对比此时两根管里气体的体积——是否接近 2:1；<br />
      ③ 点「断电」停止，气泡立刻消失，已收集的体积保留。
    </p>
  </section>

        <p>凸透镜像一块"会聚光的玻璃砖"，光线穿过后会往中间收拢。</p>
      </div>
    </div>
    <p>
      物体离透镜很远时，收拢后的光线在另一侧交汇成一个<b>倒立、缩小</b>的实像——这就是<b>照相机</b>。
      把物体慢慢拉近，像会越拉越远、越变越大；当物体越过两倍焦距，像跳到透镜另一侧且比物体还大，
      这就是<b>投影仪 / 幻灯机</b>。再靠近到焦距以内，光线不再交汇，只能朝反方向"看出去"一个放大的正立虚像——
      这就是<b>放大镜</b>。一个关键分界：物体恰在<b>焦点</b>上时不成像（平行光出射）。
    </p>
  </section>

  <section class="section-pad" id="lens-define" aria-labelledby="lens-define-title">

      <div>
        <h2 id="lens-define-title">定义：透镜公式与成像规律</h2>
        <p>一条公式贯穿所有情形。</p>
      </div>
    </div>
    <p>凸透镜成像公式：<code>1/u + 1/v = 1/f</code>，其中 <i>u</i> 物距、<i>v</i> 像距、<i>f</i> 焦距（均取正值约定）。由此：</p>
    <p style="margin:8px 0 18px">
      · <b>u &gt; 2f</b>：倒立、缩小、实像（照相机）<br />
      · <b>u = 2f</b>：倒立、等大、实像（v = 2f）<br />
      · <b>f &lt; u &lt; 2f</b>：倒立、放大、实像（投影仪）<br />
      · <b>u = f</b>：不成像（出射平行光）<br />
      · <b>u &lt; f</b>：正立、放大、<b>虚像</b>（放大镜）
    </p>
    <p>放大率 <code>m = |v/u|</code>；虚像的 <i>v</i> 取负，表示像与物体在同侧。</p>
  </section>

  <section class="section-pad" id="lens-lab" aria-labelledby="lens-lab-title">
    <div class="section-heading">
      <p class="section-index">03</p>
      <div>
        <h2 id="lens-lab-title">互动实验</h2>
        <p>拖动物体或调节滑块，对照读数面板。</p>
      </div>
    </div>
    <p>
      画面里画了两条<b>特殊光线</b>：① 从物顶发出的平行光，经透镜后过<b>另一侧的焦点</b>；
      ② 过<b>光心</b>的光线不偏折。两线交点（或其反向延长线交点）就是像的顶端。
    </p>
    <p style="margin-top:8px">
      建议这样玩：固定 <i>f</i>，把物体从远处慢慢拖近——
      看像如何从"缩小倒立"变成"放大倒立"，再越过分界变成"放大正立"的放大镜。
      注意虚像那一段，反向延长线是虚线，且<b>虚像不能在光屏上承接</b>。
    </p>
  </section>

      温度达到该物质的<b>着火点</b>。这三样构成一个"火三角"。灭火的本质，就是<b>拿走三角的任意一条边</b>：
      盖上锅盖是<b>隔绝氧气</b>，泼水是<b>降温到着火点以下</b>，搬走燃料或关闭燃气是<b>移除可燃物</b>。
    </p>

        <p>燃烧是剧烈的发光发热的氧化反应。</p>
      </div>
    </div>
    <p>
      通常所说的<b>燃烧</b>，是可燃物与氧气发生的一种<b>发光、发热的剧烈氧化反应</b>。
      三个必要条件（火三角）：<b>可燃物</b>、<b>氧气（或助燃物）</b>、<b>温度达到着火点</b>。
      三者<b>缺一不可</b>。
    </p>
    <p style="margin-top:8px">
      对应的<b>灭火原理</b>：① <b>清除可燃物</b>（如砍出防火带、关燃气阀）；
      ② <b>隔绝氧气</b>（如灭火毯、二氧化碳、泡沫）；③ <b>使温度降到着火点以下</b>（如水、干冰）。

    </p>

        <p>植物不用嘴吃，却能在阳光下"无中生有"造出养料。</p>
      </div>
    </div>
    <p>
      很久以前人们以为植物靠"吃土"长大。后来发现，植物真正的"厨房"是<b>绿叶</b>：在<b>光照</b>和<b>叶绿体</b>的帮助下，
      把空气里的<b>二氧化碳</b>和根吸来的<b>水</b>，合成为储存能量的<b>有机物（主要是淀粉）</b>，并释放<b>氧气</b>。
      所以森林被称为"地球之肺"——它不断制造氧气。没有光、没有二氧化碳、或叶子没有绿色（缺叶绿体），这间厨房就停工。
    </p>
  </section>

  <section class="section-pad" id="pho-define" aria-labelledby="pho-define-title">

      <p class="section-index">02</p>
      <div>
        <h2 id="pho-define-title">定义：反应式与条件</h2>
        <p>二氧化碳 + 水 →（光、叶绿体）→ 有机物 + 氧气。</p>
      </div>
    </div>
    <p>
      光合作用总反应式：<code>CO₂ + H₂O —(光能,叶绿体)→ (CH₂O)ₙ + O₂</code>。
      其中 <code>(CH₂O)ₙ</code> 代表以淀粉为代表的有机物。三个<b>必要条件</b>：① <b>光照</b>提供能量；
      ② <b>叶绿体</b>作为"车间"（含叶绿素）；③ 原料 <b>CO₂ 和水</b>。
    </p>
    <p style="margin-top:8px">
      初中检验方法：先把植物<b>暗处理</b>耗尽原有淀粉，再让叶片部分见光、部分遮光，光照后<b>脱色</b>加<b>碘液</b>——
      见光部分变<b>蓝黑色</b>（有淀粉），遮光部分不变蓝。本场景用"碘液检测"一步呈现。
    </p>
  </section>

  <section class="section-pad" id="pho-lab" aria-labelledby="pho-lab-title">
    <div class="section-heading">
      <p class="section-index">03</p>
      <div>
        <h2 id="pho-lab-title">互动实验</h2>
        <p>控制变量，找出光合作用必需的三个条件。</p>
      </div>
    </div>
    <p>
      ① 关掉<b>光照</b>→不再产淀粉；② 切到<b>CO₂ 不足</b>（NaOH 吸收）→不变蓝；
      ③ 选<b>银边翠兰（白斑叶）</b>→只有绿色部分（有叶绿体）变蓝，白色边缘不变蓝，证明<b>叶绿体是场所</b>。
      每改一项，点「碘液检测淀粉」看结果。
    </p>
  </section>

      跷跷板一边坐大人、一边坐小孩，若让小孩坐得离支点更远，两边就能平衡。
      关键不是谁重，而是<b>「重量 × 到支点的距离」</b>相等。这个距离叫<b>力臂</b>——
      支点到力的作用线的垂直距离。杠杆把"力"换算成"力矩"，于是轻的一端靠更长力臂扳平重的一端。
    </p>
  </section>

    <div class="section-heading">
      <p class="section-index">02</p>
      <div><h2 id="lv-define-title">定义：杠杆平衡条件</h2>
      <p>一个等式统管所有杠杆。</p></div>
    </div>
    <p><code>F₁ × L₁ = F₂ × L₂</code>（动力 × 动力臂 = 阻力 × 阻力臂）。这里用质量代替力（重力 <code>G = m·g</code>，<i>g</i> 两边约掉）。</p>

      · <b>L₁ &lt; L₂</b> 且平衡：<b>费力杠杆</b>（如镊子、钓鱼竿，省距离）<br />
      · <b>L₁ = L₂</b> 且平衡：<b>等臂杠杆</b>（如天平）
    </p>
    <p>当两边力矩不等，杠杆会朝力矩大的一侧转动，直到被限位挡住或人为调整。</p>
  </section>

      <div><h2 id="bc-intuition-title">直觉：轮船是铁做的为何不沉</h2>
      <p>浮力不看"谁重"，看"排开了多少水"。</p></div>
    </div>
    <p>
      一块实心铁会沉，但把它造成空心的轮船，排开的水就远比铁本身重——水的托力（浮力）因此大过船的重力，船就浮着。
      所以判断沉浮，要比较两个量：<b>浮力</b>（水往上托的力）和<b>重力</b>（物体往下沉的力）。
      浮力来自液体对物体上下表面的压力差，实质就是"被排开的那部分液体有多重"。
    </p>
  </section>

  <section class="section-pad" id="bc-define" aria-labelledby="bc-define-title">
    <div class="section-heading">
      <p class="section-index">02</p>
      <div><h2 id="bc-define-title">定义：阿基米德原理</h2>
      <p>一条式子给出浮力大小。</p></div>
    </div>
    <p><code>F浮 = ρ液 · g · V排</code>，即浮力 = 液体密度 × 重力加速度 × 排开液体的体积。</p>
    <p style="margin:8px 0 18px">
      · <b>ρ物 &lt; ρ液</b>：F浮 &gt; G → <b>上浮</b>，最终漂浮（部分露出）<br />
      · <b>ρ物 = ρ液</b>：F浮 = G → <b>悬浮</b>（可停在液体中任意深度）<br />
      · <b>ρ物 &gt; ρ液</b>：F浮 &lt; G → <b>下沉</b>，直至触底
    </p>
    <p>漂浮时物体静止，浮力恰等于重力；此时 <code>V排 / V物 = ρ物 / ρ液</code>。</p>
  </section>

      <p>光不是消失，而是被"弹"了回来。</p></div>
    </div>
    <p>

      <b>入射角等于反射角</b>。无数这样的反射光线进入眼睛，大脑就"以为"镜子后面有个对称的像。

    </p>

      <code>H⁺ + OH⁻ → H₂O</code>。当两边的数量刚好相等，溶液既不显酸也不显碱——<b>中和</b>了。

  <section class="section-pad" id="rs-def" aria-labelledby="rs-def-t">

      <div><h2 id="em-intuition-title">直觉：磁也能“生”电</h2>
      <p>电生磁人们早知道，磁生电却要“动”起来才行。</p></div>
    </div>
    <p>
      奥斯特发现电流能产生磁场（电生磁）后，法拉第反着想：磁场能不能产生电流？答案是——
      <b>能，但得让磁通量变化</b>。磁铁静静待着，线圈里没电流；一旦把磁铁插进或拔出，
      穿过线圈的磁力线“多起来”或“少下去”，线圈就感应出一股电流，检流计指针猛地一摆。
      磁铁停下，指针立刻回零。发电机、变压器，全是这个原理。
    </p>
  </section>

  <section class="section-pad" id="em-define" aria-labelledby="em-define-title">
    <div class="section-heading">
      <p class="section-index">02</p>
      <div><h2 id="em-define-title">定义：法拉第定律与楞次定律</h2>
      <p>变才有电，而且“反抗”这种变化。</p></div>
    </div>
    <p>
      <b>法拉第电磁感应定律</b>：感应电动势的大小与磁通量的变化率成正比，E = -N·ΔΦ/Δt。
      变化越快（磁铁动得越快），电流越大。<br />
      <b>楞次定律</b>：感应电流的方向，总是使它产生的磁场<b>阻碍</b>引起它的磁通量变化。
      插入时磁通增加，感应磁场就“推开”磁铁；拔出时磁通减少，感应磁场就“拉住”磁铁——所以
      插入与拔出时电流方向正好<b>相反</b>，检流计指针摆向两侧。
    </p>
  </section>

  <section class="section-pad" id="em-lab" aria-labelledby="em-lab-title">
    <div class="section-heading">
      <p class="section-index">03</p>
      <div><h2 id="em-lab-title">互动实验</h2>
      <p>动一下磁铁，看指针怎么回应。</p></div>
    </div>
    <p>
      点“插入线圈”让磁铁向右滑入线圈，“拔出线圈”让它退回。注意：只有磁铁<b>运动</b>时指针才摆，
      停下的瞬间立刻归零。调大“磁铁速度”，指针摆幅更大。对比两次操作，你会发现插入与拔出的
      摆向恰好相反——这正是楞次定律的痕迹。
    </p>
  </section>

      <p>前换后，氢前换氢。</p></div>

    </p>
  </section>

      <b>性质</b>：常温常压下为无色气体，密度比空气大，<b>不能燃烧也不支持燃烧</b>——既能灭火，也提醒我们进入深井、地窖前要做“灯火试验”。

    <p>
      完成一次简单反射的结构基础叫<b>反射弧</b>，必须齐备五部分：

      <b>传出神经</b>（传向效应器）→ <b>效应器</b>（肌肉或腺体，作出反应）。任何一环受损，反射都无法完成。
      脊髓能独立完成这类<b>非条件反射</b>（生来就有），而大脑负责更慢但更复杂的“想清楚再动”。

  </section>

  <section class="section-pad" id="rf-lab" aria-labelledby="rf-lab-title">
    <div class="section-heading">
      <p class="section-index">03</p>
      <div><h2 id="rf-lab-title">互动实验</h2>
      <p>点一下，看信号怎么“抄近道”。</p></div>
    </div>
    <p>
      点“触发刺激（热）”，一颗信号会从指尖出发，沿蓝色传入神经冲向脊髓；到脊髓后立刻折返，
      沿红色传出神经奔向手臂肌肉；到达瞬间，手臂肌肉收缩、手猛地缩回。注意上方的“脑”在更晚才接到通知——
      这正是反射“快”的来源。可多次触发对比。
    </p>
  </section>
