        <div class="distinction-rail">
          <article>
            <span>01 / 连续运动</span>
            <h3>1917 年的转针问题</h3>
            <p>
              在平面区域里，让长度为 1 的线段连续转过 180°，所需面积能有多小？
              若限于凸集，Pál 找到的最优区域是高为 1 的等边三角形；取消凸性后，面积可任意小。
            </p>
            <div class="mini-figure rotating-needle" aria-hidden="true"></div>
          </article>
          <article>
            <span>02 / 每个方向</span>
            <h3>Besicovitch 集合</h3>
            <p>
              集合 <i>K</i> 在每个方向都包含一条长度为 1 的线段。这样的集合可以拥有
              Lebesgue 零测度，平面里可以直观理解成“面积为零”。
            </p>
            <div class="mini-figure line-field" aria-hidden="true"></div>
          </article>
          <article>
            <span>03 / 尺度极限</span>
            <h3>现代挂谷集合猜想</h3>
            <p>
              任意 <i>n</i> 维挂谷集合都应拥有完整的 Hausdorff 维数 <i>n</i>；
              常讨论的 Minkowski 版本也预言完整维数。王虹与 Zahl 证明了 <i>n = 3</i>。
            </p>
            <div class="mini-figure dimension-cube" aria-hidden="true"></div>
          </article>
        </div>
      </section>

      <section class="definition section-pad" id="definition" aria-labelledby="definition-title">
        <div class="section-heading">
          <p class="section-index">03</p>
          <div>
            <h2 id="definition-title">完整陈述：从线段到维数</h2>
            <p>“体积”“维数”和“加粗后的体积”分别回答不同问题。</p>
          </div>
        </div>

        <div class="definition-grid">
          <article class="definition-copy">
            <h3>集合版本</h3>
            <p>
              若紧集 <i>K ⊂ ℝ<sup>n</sup></i> 对球面上的每个方向
              <i>ω ∈ S<sup>n−1</sup></i>，都包含一条与 <i>ω</i> 平行的单位线段，
              那么 <i>K</i> 称为挂谷集合（或 Besicovitch 集合）。
            </p>
            <div class="formula-box">
              <span>挂谷集合猜想</span>
              <math display="block">
                <mrow>
                  <msub><mi>dim</mi><mi>H</mi></msub>
                  <mi>K</mi>
                  <mo>=</mo>
                  <mi>n</mi>
                </mrow>
              </math>
              <p>常用的 Minkowski 版本同样预言 <i>dim<sub>M</sub> K = n</i>。</p>
            </div>
            <p class="fact-line">
              <strong>三维结论：</strong>
              王虹与 Joshua Zahl 的 2025 年论文证明，每个
              <i>K ⊂ ℝ<sup>3</sup></i> 的挂谷集合都有 Hausdorff 与 Minkowski 维数 3。
            </p>
          </article>

          <article class="dimension-definitions">
            <div>
              <span>MEASURE</span>
              <h3>零体积仍可满维</h3>
              <p>
                Lebesgue 测度记录面积或体积。挂谷集合可以是零测度，
                同时拥有与环境空间相同的分形维数；“完整维数”不保证内部含有小球。
              </p>
            </div>
            <div>
              <span>MINKOWSKI</span>
              <h3>观察 δ 邻域的缩放</h3>
              <p>
                把 <i>K</i> 向外加粗 δ，得到 <i>K<sub>δ</sub></i>。若其体积大致按
                δ<sup>n−d</sup> 缩放，<i>d</i> 就是对应的盒维数直觉。
              </p>
            </div>
            <div>
              <span>HAUSDORFF</span>
              <h3>允许不同大小的覆盖</h3>
              <p>
                用直径可变的小集合覆盖 <i>K</i>，观察直径的 <i>s</i> 次幂总和。
                临界指数给出 Hausdorff 维数，通常比固定网格更精细。
              </p>
            </div>
          </article>

            <h3 id="proof-step-title">把“每个方向”换成约 δ<sup>−2</sup> 根细管</h3>
            <p id="proof-step-body">

            <span>已解决</span>
            <h3>三维集合猜想</h3>
            <p>
              每个三维挂谷集合的 Minkowski 与 Hausdorff 维数均为 3。
              2025 年王虹—Zahl 论文给出证明；2026 年 Guth、王虹、Zahl 又给出精简版。
            </p>
          </article>
          <article>
            <span>仍开放</span>
            <h3>四维及更高维</h3>
            <p>
              三维方法依赖凸 Wolff 公理。四维起出现沿低次数代数曲面聚集的障碍，
              这一方法无法直接照搬。
            </p>
          </article>
          <article>
            <span>仍开放</span>
            <h3>更强的 maximal 版本</h3>
            <p>
              Kakeya maximal function conjecture 要求更强的算子估计。
              三维集合版本的解决没有自动给出这个更强结论。
            </p>
          </article>
        </div>

          <strong>关于 2026 年菲尔兹奖的准确说法</strong>
          <p>

        <ol class="timeline-rail">

            <time>1917</time>

          </li>
          <li>
            <time>2022</time>
            <h3>黏连情形</h3>

          </li>
          <li class="breakthrough">
            <time>2025</time>
            <h3>三维完整证明</h3>

          </li>

            <time>2026</time>
            <h3>精简证明与菲尔兹奖</h3>
            <p>精简版论文发布；王虹在费城国际数学家大会获菲尔兹奖。</p>
          </li>

    <section class="section-pad" id="se-intuition" aria-labelledby="se-intuition-title">
      <div class="section-heading">
        <p class="section-index">01</p>
        <div>
          <h2 id="se-intuition-title">直觉模型：一次苛刻的三点对齐</h2>
          <p>新月每月都有，日食却不是。差别藏在两个角度和一段距离里。</p>
        </div>
      </div>
      <div class="se-intuition-copy">
        <p>
          太阳直径约为月球的 400 倍，距离也恰好约为月地距离的 400 倍——两者在天空中的视直径
          几乎相同，都接近 0.5°。这一巧合让月球有机会不多不少地遮住日面，露出日冕。
        </p>
        <p>
          但月球绕地轨道相对黄道面倾斜约 <strong>5.1°</strong>。多数新月时刻，月球从太阳
          上方或下方数千公里处掠过，影子落进太空。只有当新月恰好发生在轨道与黄道的交点
          附近，本影或半影才能碰到地球，这就是日食季每年只出现约两次的原因。
        </p>
        <p>
          即使对齐成功，食型还取决于距离：月球本影平均长约 37.4 万公里，而月地平均距离约
          38.4 万公里。月球离地球较近时本影尖端够得着地面，看到日全食；较远时本影在半空
          收尖，地面进入其延长线（伪本影），看到的是日环食。
        </p>
      </div>
    </section>

    <section class="section-pad" aria-labelledby="se-limits-title">
      <div class="section-heading">
        <p class="section-index">02</p>
        <div>
          <h2 id="se-limits-title">这个模型简化了什么</h2>
          <p>先说清楚画面与真实世界的差距，再谈直觉。</p>
        </div>
      </div>
      <div class="limits-grid">
        <article>
          <span>比例夸张</span>
          <h3>尺寸与距离不成比例</h3>
          <p>
            按真实比例，地球在此画面中只有针尖大，太阳远在数百米外。画面放大了地球、月球
            与影锥，但食型与日食带的判定全部由公里级真实数值计算。
          </p>
        </article>
        <article>
          <span>轨道简化</span>
          <h3>圆轨道 + 固定交点</h3>
          <p>
            真实月球轨道是偏心率约 0.055 的椭圆，交点还以约 18.6 年的周期退行。这里用圆轨
            道加距离滑杆代替椭圆，用滑杆固定交点方位，不演化沙罗周期。
          </p>
        </article>
        <article>
          <span>地表简化</span>
          <h3>不含地球自转与大气折射</h3>
          <p>
            真实日食带的形状由地球自转、扁率与月影移动速度共同决定，本影地表速度常超过
            2000 km/h。此处的红线只是影轴扫过静止球面的几何轨迹。
          </p>
        </article>
      </div>
    </section>

        </div>

        <p>
          地球的本影是一个长约 <strong>140 万公里</strong>的锥体，在月球轨道距离处直径仍约
          9200 公里，超过月球直径的 2.6 倍。围绕本影还有一圈更淡的半影。满月时若月球恰好

        </p>
        <p>
          月全食的红色来自<strong>瑞利散射</strong>：太阳光掠过地球大气边缘时，波长较短的蓝
          光被空气分子强烈散射掉（散射强度约与波长四次方成反比），剩下的红光经大气折射弯
          进本影内部，把月面照成暗红色——本质上，那是环绕地球一整圈的日出与日落投在月亮上。
        </p>
      </div>

        </div>

          <span>比例夸张</span>
          <h3>月地距离被大幅压缩</h3>
          <p>
            真实月地距离约为地球半径的 60 倍，画面压缩到 4 倍。地月半径比、影锥在月球轨道处
            的粗细比例保持真实，食分全部按公里数值计算。
          </p>
        </article>
        <article>
          <span>轨道简化</span>
          <h3>黄纬用滑杆直接给定</h3>
          <p>
            真实月球黄纬由交点位置与轨道运动共同决定，且交点以 18.6 年周期退行。这里用一个
            滑杆直接设定满月时刻的黄纬，方便逐档观察食分变化。

          <p class="hero-lead">

      <section class="seasons-intuition section-pad" id="seasons-intuition" aria-labelledby="seasons-intuition-title">
        <div class="section-heading">
          <p class="section-index">01</p>
          <div>
            <h2 id="seasons-intuition-title">直觉模型</h2>
            <p>公转一圈，地轴方向几乎不变；变的是太阳直射点落在哪条纬线上。</p>
          </div>
        </div>
        <div class="seasons-copy">
          <article>
            <span>01 / 指向不变</span>
            <h3>地轴始终指向同一方向</h3>
            <p>
              地球绕太阳公转时，自转轴始终指向天空中几乎同一个位置（北极星附近），
              与公转轨道面法线夹角约 23.44°。于是一年之中，太阳直射点在南北回归线
              （±23.44°）之间往返移动。
            </p>
          </article>
          <article>
            <span>02 / 角度决定能量</span>
            <h3>直射得多，斜射摊薄</h3>
            <p>
              直射时，单位面积地表接收的阳光最多，白昼也更长；斜射时，同一束阳光
              摊在更大的面积上，且白昼变短。北半球的夏至前后，正是“直射靠北 + 长昼”
              两个效应叠加的时候。
            </p>
          </article>
          <article>
            <span>03 / 距离不是原因</span>
            <h3>近日点反而在 1 月</h3>
            <p>
              地球轨道接近圆形：近日点在 1 月初（约 1.471 亿千米），远日点在 7 月初
              （约 1.521 亿千米），相差仅约 3.3%。若距离主导季节，南北半球就不会
              季节相反——事实恰恰相反。
            </p>
          </article>
        </div>
      </section>

      <section class="section-pad" aria-labelledby="seasons-limits-title">
        <div class="section-heading">
          <p class="section-index">02</p>
          <div>
            <h2 id="seasons-limits-title">这个模型简化了什么</h2>

          </div>
        </div>
        <div class="seasons-limits-grid">

            <span>轨道形状</span>
            <h3>正圆代替椭圆</h3>
            <p>
              真实轨道偏心率约 0.017，地球在近日点附近走得更快（开普勒第二定律），
              因此北半球冬半年比夏半年短几天。演示中画成匀速正圆。
            </p>
          </article>
          <article>
            <span>比例</span>
            <h3>大小与距离不成比例</h3>
            <p>
              按真实比例，太阳直径约为地球的 109 倍，轨道半径约为太阳直径的 107 倍，
              无法同屏显示。这里只保留几何关系，不保留比例。
            </p>
          </article>
          <article>
            <span>气候滞后</span>
            <h3>光照不等于气温</h3>
            <p>
              海洋与大气的热惯性使最热、最冷的月份晚于夏至、冬至约一到两个月。
              本页只演示光照几何，不演示气候响应。
            </p>
          </article>
          <article>
            <span>更长的时间尺度</span>
            <h3>地轴方向并非永远不变</h3>
            <p>
              地轴以约 26000 年为周期缓慢进动（岁差），倾角本身也在 22.1°–24.5°
              之间做约 4.1 万年周期的振荡。在一年的尺度上，把它视为固定是合理近似。
            </p>
          </article>
        </div>

        <div class="moonp-copy">
          <article>
            <span>01 / 永远半亮</span>
            <h3>太阳光近似平行入射</h3>
            <p>
              太阳距离约为地月距离的 390 倍，射到地月系统的阳光可以视为平行光束。
              无论月球在轨道何处，它总有一半被照亮、一半处于黑夜——变化的只是
              我们能看到亮面的多少。
            </p>

            <h3>相位角从新月数起</h3>
            <p>
              新月时月球位于太阳与地球之间，亮面背对我们；满月时地球居中，
              亮面正对我们。从新月起算的相位角每转过约 45°，就依次出现
              娥眉月、上弦月、盈凸月、满月，再对称地亏回去。
            </p>

            <h3>月相不是地影</h3>

              地球影子落在月面上的现象叫月食，只发生在满月且三者近乎精确成一线时。
              日常的月相圆缺与地影无关——不然弦月的明暗界线不会是那条柔和的椭圆弧。
            </p>

    <div class="tides-scene" id="main">
      <section class="hero" id="top">

          <p class="figure-no">FIG. 04 / TIDES LAB</p>
          <h1>月亮拉海水，<br />拉出<br />两个隆起</h1>
          <p class="hero-lead">
            潮汐不是月亮“吸走”海水那么简单：近月侧与远月侧同时鼓起，
            地球在双隆起下自转，多数海岸一天迎来约两次涨落。
          </p>
          <a class="primary-action" href="#tides-intuition">

              <path d="M5 12h14M14 7l5 5-5 5" />
            </svg>
          </a>
          <p class="hero-note">
            拖动旋转 · 滚轮缩放 · 滑杆调节地月距离与公转位置<br />
            隆起幅度已大幅夸张，引潮力按 1/r³ 真实关系计算。
          </p>
        </div>

        <div class="lab-shell" aria-label="潮汐交互实验">
          <div class="lab-canvas-wrap">
            <canvas class="tides-canvas" id="tides-canvas" aria-label="地月系统潮汐隆起三维模型"></canvas>
            <div class="canvas-caption">
              <span>海水层隆起已大幅夸张 · 红点为地表观察点</span>
              <span id="tides-status">引潮力 1.00× · 太阳影响关</span>
            </div>
          </div>

          <aside class="lab-controls" aria-label="实验设置">
            <h2>实验设置</h2>

            <label class="control-row" for="tides-dist">
              <span>地月距离（相对平均值）</span>
              <output id="tides-dist-output">1.00×</output>
            </label>
            <input id="tides-dist" type="range" min="0.7" max="1.3" step="0.01" value="1" />

            <label class="control-row" for="tides-angle">
              <span>月球公转位置（0° 为朔）</span>
              <output id="tides-angle-output">0°</output>
            </label>
            <input id="tides-angle" type="range" min="0" max="360" step="1" value="0" />

            <button id="tides-sun" class="tides-toggle" type="button" aria-pressed="false">
              太阳影响（演示大潮 / 小潮）
              <span class="tides-toggle-state">关</span>
            </button>

            <div class="tides-data" aria-live="polite">
              <div>
                <span>月球引潮力（相对 1/r³）</span>
                <strong id="tides-force">1.00×</strong>
              </div>
              <div>
                <span>太阳 / 月球引潮力之比</span>
                <strong id="tides-ratio">0.46（固定）</strong>

              真实的开阔大洋中，平衡潮隆起只有几十厘米量级；

      <section class="tides-intuition section-pad" id="tides-intuition" aria-labelledby="tides-intuition-title">
        <div class="section-heading">
          <p class="section-index">01</p>
          <div>
            <h2 id="tides-intuition-title">直觉模型</h2>
            <p>关键不是引力本身，而是引力在地球两侧的“差值”。</p>
          </div>
        </div>
        <div class="tides-copy">
          <article>
            <span>01 / 差异引力</span>
            <h3>近侧拉得多，远侧拉得少</h3>
            <p>
              月球引力随距离衰减：地球近月一侧被拉得比地心更用力，远月一侧
              被拉得更弱。以地心为参照，两侧海水都相对“向外”偏离——
              这就是引潮力，也是双隆起的来源。
            </p>
          </article>
          <article>
            <span>02 / 立方反比</span>
            <h3>引潮力 ∝ M / r³</h3>
            <p>
              引力按 1/r² 衰减，而引潮力是引力的差值，按 1/r³ 衰减。
              太阳引力远强于月球，但因距离是地月距离的约 390 倍，
              其引潮力反而只有月球的约 46%——月球主导潮汐。
            </p>
          </article>
          <article>
            <span>03 / 大潮小潮</span>
            <h3>叠加还是抵消</h3>
            <p>
              朔（新月）与望（满月）时，日月引潮力方向成一线，隆起叠加，
              形成大潮；上弦、下弦时两者相互垂直，部分抵消，形成小潮。
              两者潮差通常相差可达一倍左右，随海区而异。
            </p>
          </article>
        </div>
      </section>

      <section class="section-pad" aria-labelledby="tides-limits-title">
        <div class="section-heading">
          <p class="section-index">02</p>
          <div>
            <h2 id="tides-limits-title">这个模型简化了什么</h2>
            <p>这里演示的是“平衡潮”理想模型——真实海潮要复杂得多。</p>
          </div>
        </div>
        <div class="tides-limits-grid">
          <article>
            <span>平衡潮假设</span>
            <h3>海水被当作瞬时响应的薄壳</h3>
            <p>
              模型假设全球被均匀海水覆盖、且瞬间调整到受力平衡的形状。
              真实海水有惯性与摩擦，潮波在海盆中传播、反射、共振，
              实际高潮时刻往往滞后于月球过顶。
            </p>
          </article>
          <article>
            <span>地形</span>
            <h3>没有大陆与海底地形</h3>
            <p>
              大陆阻挡与浅海放大效应使各地潮差悬殊：开阔大洋不足 1 米，
              芬迪湾可超过 15 米。这些都无法从平衡潮模型读出。
            </p>
          </article>
          <article>
            <span>幅度与比例</span>
            <h3>隆起被放大了数百万倍</h3>
            <p>
              画面中的隆起幅度、天体大小与距离均未按真实比例绘制。
              距离滑杆对应的 0.7–1.3 倍变化范围也远大于真实月球轨道
              近地点 / 远地点约 ±5.5% 的变化。
            </p>
          </article>
          <article>
            <span>其他因素</span>
            <h3>忽略轨道倾角与固体潮</h3>
            <p>
              月球轨道相对赤道有倾角，带来周日潮不等；地壳本身也有几十厘米的
              固体潮形变；太阳距离同样有年变化。模型将这些全部略去。
            </p>
          </article>
        </div>
      </section>

    <section class="section-pad" id="sat-intuition" aria-labelledby="sat-intuition-title">
      <div class="section-heading">
        <p class="section-index">01</p>
        <div>
          <h2 id="sat-intuition-title">直觉模型：牛顿的大炮</h2>
          <p>把大炮架上高山，炮弹打得越快，落点越远——快到某个程度，它就再也落不回来。</p>
        </div>
      </div>
      <div class="sat-copy">
        <p>
          卫星并没有逃离重力。在 400 km 高度，地球引力仍有地面的约 89%。卫星之所以不掉下来，
          是因为它横向速度足够大：每下落一段，地面也因为地球的曲率“躲开”了一段。轨道就是一场永远追不上的坠落。
        </p>
        <p>
          在同一高度切向发射，结局只取决于速度。速度恰好等于 √(μ/r) 时得到圆轨道；再快一些，轨道拉成椭圆，
          发射点成为近地点；达到 √(2μ/r)（约为圆轨道速度的 1.41 倍）时能量归零，卫星沿抛物线一去不返；
          而速度不足时，椭圆的近地点会低到扎进大气层——那就是坠落。
        </p>
        <p>
          高度还决定周期。开普勒第三定律说 T² ∝ a³：轨道越高，转一圈越久。GEO 的 35786 km
          正是让周期精确等于一个恒星日（23 时 56 分）的高度，卫星因此“钉”在赤道上空同一点。
        </p>
      </div>
    </section>

    <section class="limits section-pad" aria-labelledby="sat-limits-title">
      <div class="section-heading">
        <p class="section-index">02</p>
        <div>
          <h2 id="sat-limits-title">这个模型简化了什么</h2>
          <p>画面帮助建立直觉，但真实航天动力学远比二体问题复杂。</p>
        </div>
      </div>
      <div class="limits-grid">
        <article>
          <span>简化 1</span>
          <h3>纯二体、无摄动</h3>
          <p>
            只计算地球质点引力。真实轨道还受地球扁率（J2 项）、日月引力、太阳光压等摄动，
            GEO 卫星需要定期修正位置。
          </p>
        </article>
        <article>
          <span>简化 2</span>
          <h3>大气阻力被放大</h3>
          <p>
            为了几十秒内看清衰减螺旋，阻力系数被人为放大了多个数量级。
            真实的 400 km 轨道衰减以月和年计，且强烈依赖太阳活动。
          </p>
        </article>
        <article>
          <span>简化 3</span>
          <h3>切向发射、瞬时给速</h3>
          <p>
            实验假设卫星在目标高度瞬间获得水平速度。真实发射是持续推力的上升与转弯过程，
            还要计入重力损耗与大气损耗。
          </p>
        </article>
      </div>
    </section>

      <div class="hero-copy">
        <p class="figure-no">FIG. 03 / TECTONICS LAB</p>
        <h1>大陆在漂，<br />只是慢得<br />像指甲生长。</h1>
        <p class="hero-lead">
          地球外壳碎成十几块刚性板块，以每年 2–10 cm 的速度相互推挤、分离、错动。
        </p>
        <a class="primary-action" href="#plate-intuition">
          开始实验
          <svg viewBox="0 0 24 24" aria-hidden="true">

          </svg>
        </a>
        <p class="hero-note">
          拖动旋转 · 滚轮缩放 · 拉动时间滑杆看百万年尺度的漂移<br />
          板块形状为示意简化，运动方向参考现代 GPS 观测趋势。
        </p>

    <section class="section-pad" id="plate-intuition" aria-labelledby="plate-intuition-title">
      <div class="section-heading">
        <p class="section-index">01</p>
        <div>
          <h2 id="plate-intuition-title">直觉模型：漂在软垫上的硬壳</h2>
          <p>岩石圈是硬的，下面的软流圈却能缓慢流动——硬壳因此可以整块移动。</p>
        </div>
      </div>
      <div class="plate-copy">
        <p>
          地球最外层约 100 km 厚的岩石圈并不是完整一块，而是碎成七大板块与若干小板块。
          板块内部近似刚性，变形和地震集中在板块之间的边界上——把全球地震震中画在地图上，
          板块的轮廓会自己浮现出来。
        </p>
        <p>
          刚性板块在球面上的运动等价于绕某根轴的旋转，这根轴与地表的交点叫欧拉极。
          板块上每一点的速度方向都垂直于它到欧拉极的连线，离极越远走得越快。
          本页的演示正是让每个板块绕各自的欧拉极匀速旋转。
        </p>
        <p>
          速度量级是每年 2–10 cm：大西洋中脊扩张较慢（约 2–5 cm/yr），东太平洋隆起较快（可超过 10 cm/yr）。
          听上去微不足道，但乘以一亿年，就是上万公里——足够让大西洋从一条裂缝张成一片大洋。
        </p>
      </div>
    </section>

    <section class="section-pad" aria-labelledby="plate-boundary-title">
      <div class="section-heading">
        <p class="section-index">02</p>
        <div>
          <h2 id="plate-boundary-title">剖面实验：三种板块边界</h2>
          <p>板块相遇的方式只有三种：分开、相撞、擦肩而过。</p>
        </div>
      </div>
      <div class="plate-section-lab">
        <div class="plate-section-panel">
          <canvas id="plate-section-canvas" aria-label="板块边界剖面示意"></canvas>
        </div>
        <div class="plate-section-copy">
          <div class="segmented" role="group" aria-label="边界类型">
            <button class="is-active" data-plate-boundary="divergent" type="button">离散边界</button>
            <button data-plate-boundary="convergent" type="button">汇聚边界</button>
            <button data-plate-boundary="transform" type="button">转换边界</button>
          </div>
          <h3 id="plate-boundary-name">离散边界 · 洋中脊</h3>
          <p id="plate-boundary-body">
            两个板块相互分离，地幔物质上涌、冷凝成新的洋壳，形成绵延全球约 6.5 万 km 的洋中脊体系。
            大西洋中脊每年新增约 2–5 cm 洋底，冰岛正是它露出海面的部分。
          </p>
        </div>
      </div>
    </section>

    <section class="limits section-pad" aria-labelledby="plate-limits-title">
      <div class="section-heading">
        <p class="section-index">03</p>
        <div>
          <h2 id="plate-limits-title">这个模型简化了什么</h2>
          <p>示意图帮助看清机制，但真实板块构造有更多细节。</p>
        </div>
      </div>
      <div class="limits-grid">
        <article>
          <span>简化 1</span>
          <h3>板块形状是示意的</h3>
          <p>
            画面用球面近邻分区生成色块，只保留“十几块、大小悬殊”的拓扑感，
            并不复现真实板块边界的几何细节。
          </p>
        </article>
        <article>
          <span>简化 2</span>
          <h3>欧拉极与速度被固定</h3>
          <p>
            演示假设每个板块的旋转轴和速率在两亿年里不变。真实板块运动会因碰撞、俯冲板片断离
            等事件改变方向——印度板块就曾在与欧亚碰撞后明显减速。
          </p>
        </article>
        <article>
          <span>简化 3</span>
          <h3>边界不产生新地壳</h3>
          <p>
            演示中板块分离处只露出底色，不生成新洋壳，汇聚处则直接穿插。
            真实边界伴随增生、俯冲消减、造山与火山作用。
          </p>
        </article>
      </div>
    </section>

        <p class="section-index">01</p>
        <div>
          <h2 id="refr-intuition-title">直觉模型：光在换挡</h2>
          <p>折射率 n 是"光在这种介质里慢了多少倍"。光变速，方向就得跟着变。</p>
        </div>
      </div>
      <div class="refr-copy">
        <p>
          光在真空中每秒走约 30 万 km，进入水里就慢到约 22.5 万 km（30÷1.33）。
          一个常用的类比：一队士兵斜着从公路踏进泥地，先踩进泥地的一侧先减速，
          整个队列的前进方向于是向"慢的一侧"偏转——这就是光从疏介质进入密介质时向法线偏折的原因。
        </p>
        <p>
          Snell 定律把这件事写成等式：n₁sinθ₁ = n₂sinθ₂。两侧折射率差得越多，弯折越明显。
          它在 1621 年由斯涅尔重新发现，也可以从费马"光走耗时最短路径"的原理推出。
        </p>
        <p>
          反过来，光从密介质射向疏介质（比如从水底望向水面）时会偏离法线。当入射角超过临界角
          θc = arcsin(n₂/n₁)，sinθ₂ 需要大于 1——折射光线不存在了，全部能量被反射回来，这就是全反射。
          水下 48.6° 之外的天空看不见、光纤把信号困在纤芯里、钻石 24.4° 的小临界角让光反复内弹，都是同一件事。
        </p>
      </div>
    </section>

            演示里只画一条"平均"光线，不体现色散。
          </p>
        </article>
        <article>
          <span>简化 2</span>
          <h3>光强分配是示意的</h3>
          <p>
            反射光与折射光各带走多少能量由菲涅耳方程决定，且与偏振有关。
            画面只用线条粗细与透明度示意"临界角附近反射变强"的趋势，数值并不精确。
          </p>
        </article>

          <span>简化 3</span>
          <h3>界面理想平整</h3>

            演示假设两介质之间是无限薄的光滑平面。真实界面有粗糙度与过渡层，

          </p>

        <h2 id="fourier-define-title">定义：傅里叶级数</h2>
        <p>周期为 2π 的函数可展开为正弦/余弦的加权和。</p>
      </div>
    </div>
    <p>
      以方波为例，其傅里叶级数为 <code>f(θ) = (4/π)·Σ sin((2k−1)θ)/(2k−1)</code>，
      只含奇次谐波、振幅随 1/(2k−1) 衰减。锯齿波与三角波的系数结构不同（见上方波形切换）：
      锯齿波含全部整数次谐波、三角波衰减最快（1/(2k+1)²），所以三角波用很少的谐波就已很平滑。
      切换波形并调小 <i>N</i>，可以直观看到「收敛快慢」的差异。

    </p>

        <p>同一次地震，P 波先到、S 波后到，中间隔着一段空白。</p>
      </div>
    </div>
    <p>
      想象两个人从同一起点出发跑向终点，一个快、一个慢。终点处的人看两人到达的<b>时间差</b>，

      P 与 S 是速度已知的两位"跑者"，它们的到时差 Δt 越大，震源越远。
    </p>
  </section>

  <section class="section-pad" id="seis-def" aria-labelledby="seis-def-title">

        <p>体波（body wave）的两种：纵波与横波。</p>
      </div>
    </div>
    <p>
      <b>P 波（纵波 / 初至波）</b>：介质粒子沿传播方向来回振动，像弹簧的疏密波，速度最快，能在固体与液体中传播。
      <b>S 波（横波 / 次波）</b>：粒子垂直于传播方向振动，速度约为 P 波的 0.55–0.6 倍，且<b>无法在液体中传播</b>——
      正是这一点，让科学家在 20 世纪证实地球外核是液态的。本实验中两者速度由滑块设定，互不相干地向外扩张。
    </p>
  </section>

      </div>

    </p>

    </p>

      <div>
        <h2 id="ely-intuition-title">直觉：水不是"元素"</h2>
        <p>看似纯净的一杯水，其实是氢和氧的化合物。</p>
      </div>
    </div>
    <p>
      通电之前，水安静地待在杯里。一旦接上直流电，水分子被"拆开"：在负极（阴极）得到电子放出
      <b>氢气</b>，在正极（阳极）放出 <b>氧气</b>。两种气体用倒扣的试管收集，会发现氢气体积总是氧气的
      <b>两倍</b>——这个 2:1，正是水分子里氢原子与氧原子的个数比。
    </p>
  </section>

  <section class="section-pad" id="ely-define" aria-labelledby="ely-define-title">
    <div class="section-heading">
      <p class="section-index">02</p>
      <div>
        <h2 id="ely-define-title">定义：电解水反应</h2>
        <p>水在直流电下分解为氢气与氧气。</p>
      </div>
    </div>
    <p style="font-family: var(--mono, monospace); font-size: 13px; line-height: 2">
      阴极(−)：2H₂O + 2e⁻ → H₂↑ + 2OH⁻<br />
      阳极(+)：2H₂O → O₂↑ + 4H⁺ + 4e⁻<br />
      总反应：2H₂O <span style="white-space:nowrap">—通电→</span> 2H₂↑ + O₂↑
    </p>
    <p>
      每生成 1 个 O₂ 分子，同时生成 2 个 H₂ 分子，所以同温同压下
      <b>V(H₂) : V(O₂) = 2 : 1</b>。据此还能推知：水由氢、氧两种元素组成，分子中 H:O = 2:1。
    </p>
  </section>

  <section class="section-pad" id="ely-lab" aria-labelledby="ely-lab-title">
    <div class="section-heading">
      <p class="section-index">03</p>
      <div>
        <h2 id="ely-lab-title">互动实验</h2>
        <p>通电、调电流、看体积比如何稳定收敛到 2:1。</p>
      </div>
    </div>
    <p>
      点「通电」开始电解：左侧阴极冒气泡更快（氢气），右侧阳极较慢（氧气）。两根量气管的液面随之下降，
      气体体积持续增长。建议这样观察：
    </p>
    <p style="margin-top:8px">
      ① 调大「电流大小」，气泡更密、产气更快，但 2:1 的比例不变；<br />
      ② 等任一试管集满，对比此时两根管里气体的体积——是否接近 2:1；<br />
      ③ 点「断电」停止，气泡立刻消失，已收集的体积保留。
    </p>
  </section>

        <p>凸透镜像一块"会聚光的玻璃砖"，光线穿过后会往中间收拢。</p>
      </div>
    </div>
    <p>
      物体离透镜很远时，收拢后的光线在另一侧交汇成一个<b>倒立、缩小</b>的实像——这就是<b>照相机</b>。
      把物体慢慢拉近，像会越拉越远、越变越大；当物体越过两倍焦距，像跳到透镜另一侧且比物体还大，
      这就是<b>投影仪 / 幻灯机</b>。再靠近到焦距以内，光线不再交汇，只能朝反方向"看出去"一个放大的正立虚像——
      这就是<b>放大镜</b>。一个关键分界：物体恰在<b>焦点</b>上时不成像（平行光出射）。
    </p>
  </section>

  <section class="section-pad" id="lens-define" aria-labelledby="lens-define-title">

      <div>
        <h2 id="lens-define-title">定义：透镜公式与成像规律</h2>
        <p>一条公式贯穿所有情形。</p>
      </div>
    </div>
    <p>凸透镜成像公式：<code>1/u + 1/v = 1/f</code>，其中 <i>u</i> 物距、<i>v</i> 像距、<i>f</i> 焦距（均取正值约定）。由此：</p>
    <p style="margin:8px 0 18px">
      · <b>u &gt; 2f</b>：倒立、缩小、实像（照相机）<br />
      · <b>u = 2f</b>：倒立、等大、实像（v = 2f）<br />
      · <b>f &lt; u &lt; 2f</b>：倒立、放大、实像（投影仪）<br />
      · <b>u = f</b>：不成像（出射平行光）<br />
      · <b>u &lt; f</b>：正立、放大、<b>虚像</b>（放大镜）
    </p>
    <p>放大率 <code>m = |v/u|</code>；虚像的 <i>v</i> 取负，表示像与物体在同侧。</p>
  </section>

  <section class="section-pad" id="lens-lab" aria-labelledby="lens-lab-title">
    <div class="section-heading">
      <p class="section-index">03</p>

        <h2 id="lens-lab-title">互动实验</h2>
        <p>拖动物体或调节滑块，对照读数面板。</p>
      </div>
    </div>
    <p>
      画面里画了两条<b>特殊光线</b>：① 从物顶发出的平行光，经透镜后过<b>另一侧的焦点</b>；
      ② 过<b>光心</b>的光线不偏折。两线交点（或其反向延长线交点）就是像的顶端。
    </p>
    <p style="margin-top:8px">
      建议这样玩：固定 <i>f</i>，把物体从远处慢慢拖近——
      看像如何从"缩小倒立"变成"放大倒立"，再越过分界变成"放大正立"的放大镜。
      注意虚像那一段，反向延长线是虚线，且<b>虚像不能在光屏上承接</b>。
    </p>
  </section>

        <p>把燃烧想成一个"三条腿的凳子"，少一条腿就坐不稳。</p>
      </div>
    </div>
    <p>
      要让一样东西烧起来，必须同时备齐三样东西：有<b>可燃物</b>（木头、纸张）、有<b>氧气</b>（空气里约 21%）、
      温度达到该物质的<b>着火点</b>。这三样构成一个"火三角"。灭火的本质，就是<b>拿走三角的任意一条边</b>：
      盖上锅盖是<b>隔绝氧气</b>，泼水是<b>降温到着火点以下</b>，搬走燃料或关闭燃气是<b>移除可燃物</b>。
    </p>
  </section>

  <section class="section-pad" id="fire-define" aria-labelledby="fire-define-title">
    <div class="section-heading">
      <p class="section-index">02</p>
      <div>
        <h2 id="fire-define-title">定义：燃烧与灭火</h2>
        <p>燃烧是剧烈的发光发热的氧化反应。</p>
      </div>
    </div>
    <p>
      通常所说的<b>燃烧</b>，是可燃物与氧气发生的一种<b>发光、发热的剧烈氧化反应</b>。
      三个必要条件（火三角）：<b>可燃物</b>、<b>氧气（或助燃物）</b>、<b>温度达到着火点</b>。
      三者<b>缺一不可</b>。
    </p>
    <p style="margin-top:8px">
      对应的<b>灭火原理</b>：① <b>清除可燃物</b>（如砍出防火带、关燃气阀）；
      ② <b>隔绝氧气</b>（如灭火毯、二氧化碳、泡沫）；③ <b>使温度降到着火点以下</b>（如水、干冰）。
      注意：并非所有灭火都靠"降温"，油锅着火不能用水（油浮在水上继续烧且飞溅），应盖锅盖隔绝氧气。
    </p>
  </section>

      </article>

    </p>

    </div>
    <p>

      支点到力的作用线的垂直距离。杠杆把"力"换算成"力矩"，于是轻的一端靠更长力臂扳平重的一端。
    </p>

      <p>一个等式统管所有杠杆。</p></div>

    <p><code>F₁ × L₁ = F₂ × L₂</code>（动力 × 动力臂 = 阻力 × 阻力臂）。这里用质量代替力（重力 <code>G = m·g</code>，<i>g</i> 两边约掉）。</p>
    <p style="margin:8px 0 18px">
      · <b>L₁ &gt; L₂</b> 且平衡：<b>省力杠杆</b>（如撬棍、钳子）<br />
      · <b>L₁ &lt; L₂</b> 且平衡：<b>费力杠杆</b>（如镊子、钓鱼竿，省距离）<br />
      · <b>L₁ = L₂</b> 且平衡：<b>等臂杠杆</b>（如天平）
    </p>
    <p>当两边力矩不等，杠杆会朝力矩大的一侧转动，直到被限位挡住或人为调整。</p>

      <div><h2 id="rf-intuition-title">直觉：为什么镜子能成像</h2>
      <p>光不是消失，而是被"弹"了回来。</p></div>
    </div>
    <p>
      光在均匀介质里沿直线传播，碰到光滑表面（如镜子）几乎不被吸收，而是按一个简单规则弹回：
      <b>入射角等于反射角</b>。无数这样的反射光线进入眼睛，大脑就"以为"镜子后面有个对称的像。

    </p>

      ③ <code>反射角 r = 入射角 i</code>。
    </p>
    <p style="margin-top:12px">入射角是"入射光线与法线的夹角"、反射角是"反射光线与法线的夹角"，都从法线量起，不是从镜面量起。</p>
  </section>

    </div>
    <p>
      拖动红点光源改变入射角，观察绿线（反射光）如何对称地改变——无论 i 是 10° 还是 80°，始终 r = i。
      当 i = 0°（垂直入射）时，光原路返回。读数面板实时显示 i 与 r，验证反射定律。
    </p>

    </div>
    <p>

      <code>H⁺ + OH⁻ → H₂O</code>。当两边的数量刚好相等，溶液既不显酸也不显碱——<b>中和</b>了。

  <section class="section-pad" id="sg-intuition" aria-labelledby="sg-intuition-title">

      <div><h2 id="sg-intuition-title">直觉：为什么干燥的种子不发芽</h2>
      <p>萌发是场"化学开工"，需要水和氧来供能。</p></div>
    </div>
    <p>
      干燥的种子代谢几乎停摆。吸水后，子叶里的贮藏物质才被酶分解、运给胚根胚芽；
      同时种子要呼吸（消耗氧气）来提供能量。温度太低，酶"懒得动"，反应就停。
      所以<b>水分、空气（氧）、适宜温度</b>三者同时具备，种子才会启动萌发——少一个都不行。
    </p>
  </section>

    </div>

      · 对照组（三者齐全）→ <b>萌发</b><br />
      · 无水 → 不萌发（缺①）<br />
      · 完全浸没（缺氧气）→ 不萌发（缺②）<br />
      · 低温（如冰箱）→ 不萌发（缺③）
    </p>
    <p>注意：光照一般<b>不是</b>萌发的必要条件（少数种子例外），本实验不把它列为变量。</p>
  </section>

    </p>

    <div class="section-heading">
      <p class="section-index">01</p>
      <div><h2 id="bl-intuition-title">直觉：为什么血是"两色"的</h2>
      <p>同一管血，去肺的路上是蓝的，回来就红了。</p></div>
    </div>
    <p>
      血液的颜色取决于含不含氧。从心脏流往<b>肺部</b>的血已经把氧交给全身，是缺氧的（画成蓝）；
      在肺泡里重新"灌满"氧气后流回心脏，变成含氧血（画成红）。接着它从心脏泵向<b>全身</b>释放氧气，
      又变回蓝，回到心脏——如此往复。心脏像个双联水泵，同时推动这两条环，互不相混。
    </p>
  </section>

  <section class="section-pad" id="bl-define" aria-labelledby="bl-define-title">
    <div class="section-heading">
      <p class="section-index">02</p>
      <div><h2 id="bl-define-title">定义：肺循环与体循环</h2>
      <p>两条环路，一个心脏。</p></div>
    </div>
    <p>
      <b>肺循环（小循环）</b>：右心室 → 肺动脉（缺氧，蓝）→ 肺部毛细血管（换气：CO₂ 出、O₂ 入）→ 肺静脉（含氧，红）→ 左心房。<br />
      <b>体循环（大循环）</b>：左心室 → 主动脉（含氧，红）→ 全身毛细血管（放氧、收 CO₂）→ 上、下腔静脉（缺氧，蓝）→ 右心房。
    </p>
    <p style="margin-top:12px">注：动脉血≠一定在动脉里——肺动脉流的是缺氧血，肺静脉流的是含氧血，"动脉/静脉"指流向而非含氧量。</p>
  </section>

  <section class="section-pad" id="bl-lab" aria-labelledby="bl-lab-title">
    <div class="section-heading">
      <p class="section-index">03</p>
      <div><h2 id="bl-lab-title">互动实验</h2>
      <p>看粒子在两条环上如何变色。</p></div>
    </div>
    <p>
      上方环是肺循环：粒子从右心出发是蓝的，经过肺部（顶部）变成红的回到左心。
      下方环是体循环：从左心出发是红的，经过全身（底部）变成蓝的回到右心。
      调节速度滑块，看清"充氧—放氧"在肺部与全身两端发生，而心脏两端颜色始终不同。
    </p>
  </section>
